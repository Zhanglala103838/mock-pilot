<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Mock 数据工作台 — 生成个人、账号、业务、通用字段、UUID、占位图和接口响应的 mock 数据。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Mock Pilot · Mock 数据工作台</title>
    <script>
      // anti-FOUC：在样式加载前确定主题，避免深色闪烁。
      (function () {
        try {
          var saved = localStorage.getItem("hulian-theme");
          if (saved === "system") saved = null;
          var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
